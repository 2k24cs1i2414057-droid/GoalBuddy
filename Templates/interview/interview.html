<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Mock Interview | GoalBuddy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gb-bg: #080E1A;
    --gb-surface: #0F1825;
    --gb-card: #162030;
    --gb-card2: #1C2A3E;
    --gb-accent: #00D4A8;
    --gb-accent2: #3B82F6;
    --gb-accent-dim: rgba(0, 212, 168, 0.12);
    --gb-text: #EDF2F7;
    --gb-muted: #7A90A8;
    --gb-border: #1E2F44;
    --gb-border2: #253650;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--gb-bg); color: var(--gb-text); min-height: 100vh; }
  h1, h2, h3, h4 { font-family: 'Sora', sans-serif; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes wave { 0%, 100% { height: 6px; } 50% { height: 30px; } }
  @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); } 50% { box-shadow: 0 0 0 14px rgba(239,68,68,0); } }
  @keyframes pulse-green { 0%, 100% { box-shadow: 0 0 0 0 rgba(0,212,168,0.45); } 50% { box-shadow: 0 0 0 14px rgba(0,212,168,0); } }
  @keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
  @keyframes dotBounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

  .animate-in { animation: fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) forwards; }
  .wave-bar { width: 4px; background: var(--gb-accent); border-radius: 2px; animation: wave 0.7s ease-in-out infinite; }
  .wave-bar:nth-child(1) { animation-delay: 0s; }
  .wave-bar:nth-child(2) { animation-delay: 0.1s; }
  .wave-bar:nth-child(3) { animation-delay: 0.2s; }
  .wave-bar:nth-child(4) { animation-delay: 0.3s; }
  .wave-bar:nth-child(5) { animation-delay: 0.4s; }
  .wave-bar.red { background: #EF4444; }

  .card { background: var(--gb-card); border: 1px solid var(--gb-border); border-radius: 16px; }
  .card2 { background: var(--gb-card2); border: 1px solid var(--gb-border2); border-radius: 14px; }

  .btn-primary {
    background: linear-gradient(135deg, #00D4A8 0%, #0EA5E9 100%);
    color: #060D17; font-weight: 600; font-family: 'Sora', sans-serif;
    border-radius: 12px; border: none; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(0,212,168,0.28); }
  .btn-primary:active { transform: scale(0.98); }

  .btn-ghost {
    background: transparent; border: 1px solid var(--gb-border2); color: var(--gb-muted);
    border-radius: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 500;
    transition: border-color 0.15s, color 0.15s; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-ghost:hover { border-color: var(--gb-accent); color: var(--gb-accent); }
  .btn-ghost:active { transform: scale(0.98); }

  .input-field {
    background: var(--gb-surface); border: 1.5px solid var(--gb-border2); border-radius: 12px;
    color: var(--gb-text); width: 100%; font-family: 'DM Sans', sans-serif; font-size: 15px;
    transition: border-color 0.2s, box-shadow 0.2s; outline: none;
  }
  .input-field::placeholder { color: var(--gb-muted); }
  .input-field:focus { border-color: var(--gb-accent); box-shadow: 0 0 0 3px rgba(0,212,168,0.1); }

  .level-opt { border: 1.5px solid var(--gb-border2); border-radius: 14px; cursor: pointer; transition: all 0.2s; }
  .level-opt:hover { border-color: var(--gb-muted); }
  .level-opt.active { border-color: var(--gb-accent); background: var(--gb-accent-dim); }
  .level-opt.active .level-label { color: var(--gb-accent); }

  .mic-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
  .mic-btn {
    width: 80px; height: 80px; border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: transform 0.15s; position: relative; z-index: 1;
  }
  .mic-btn.idle { background: linear-gradient(135deg, #00D4A8, #0EA5E9); animation: pulse-green 2s infinite; }
  .mic-btn.recording { background: linear-gradient(135deg, #EF4444, #F97316); animation: pulse-glow 1.2s infinite; }
  .mic-btn:hover { transform: scale(1.06); }

  .progress-track { height: 5px; background: var(--gb-border); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #00D4A8, #3B82F6); border-radius: 3px; transition: width 0.6s cubic-bezier(0.22,1,0.36,1); }

  .step-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; font-family: 'Sora', sans-serif; flex-shrink: 0; }
  .step-dot.done { background: var(--gb-accent); color: #060D17; }
  .step-dot.active { background: var(--gb-accent-dim); color: var(--gb-accent); border: 1.5px solid var(--gb-accent); }
  .step-dot.upcoming { background: var(--gb-surface); color: var(--gb-muted); border: 1px solid var(--gb-border2); }

  .chip { display: inline-flex; align-items: center; border-radius: 8px; font-size: 12px; font-weight: 500; padding: 4px 10px; }
  .chip-teal { background: rgba(0,212,168,0.12); color: #00D4A8; border: 1px solid rgba(0,212,168,0.25); }
  .chip-amber { background: rgba(245,158,11,0.12); color: #F59E0B; border: 1px solid rgba(245,158,11,0.25); }
  .chip-red { background: rgba(239,68,68,0.12); color: #EF4444; border: 1px solid rgba(239,68,68,0.25); }
  .chip-blue { background: rgba(59,130,246,0.12); color: #60A5FA; border: 1px solid rgba(59,130,246,0.25); }

  .loader { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--gb-border2); border-top-color: var(--gb-accent); animation: spin 0.75s linear infinite; }

  .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: var(--gb-card2); border: 1px solid rgba(0,212,168,0.3); color: var(--gb-text); padding: 11px 20px; border-radius: 12px; font-size: 14px; z-index: 9999; animation: fadeUp 0.3s ease; white-space: nowrap; }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--gb-bg); }
  ::-webkit-scrollbar-thumb { background: var(--gb-border2); border-radius: 3px; }

  .tag-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag-pill { background: var(--gb-surface); border: 1px solid var(--gb-border2); color: var(--gb-muted); border-radius: 20px; padding: 5px 14px; font-size: 13px; cursor: pointer; transition: all 0.15s; }
  .tag-pill:hover { border-color: var(--gb-accent); color: var(--gb-accent); }

  .feature-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  .score-svg circle:last-child { transition: stroke-dashoffset 1.8s cubic-bezier(0.22,1,0.36,1); }

  .section-bar { height: 6px; border-radius: 3px; overflow: hidden; background: var(--gb-border); }
  .section-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #00D4A8, #3B82F6); transition: width 1.4s cubic-bezier(0.22,1,0.36,1); }

  .logout-btn { display: flex; align-items: center; gap: 7px; padding: 7px 16px; border-radius: 10px; border: 1px solid var(--gb-border2); background: transparent; color: var(--gb-muted); font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.15s; }
  .logout-btn:hover { border-color: #EF4444; color: #EF4444; background: rgba(239,68,68,0.08); }

  @media (max-width: 480px) {
    .step-label { display: none; }
    .btn-row { flex-direction: column; }
  }
</style>
</head>
<body>

<!-- ── HEADER ─────────────────────────────────────────────────────────── -->
<header style="background: var(--gb-surface); border-bottom: 1px solid var(--gb-border); position: sticky; top: 0; z-index: 100;">
  <div style="max-width: 720px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#00D4A8,#3B82F6);display:flex;align-items:center;justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
          <path d="M10 2L12.5 7.5H18L13.5 11L15.5 17L10 13.5L4.5 17L6.5 11L2 7.5H7.5L10 2Z" fill="#060D17"/>
        </svg>
      </div>
      <div>
        <span style="font-family:'Sora',sans-serif;font-weight:600;font-size:15px;color:var(--gb-text);">GoalBuddy</span>
        <span style="color:var(--gb-muted);font-size:13px;margin-left:8px;">/ AI Interview</span>
      </div>
    </div>
    <a href="{% url 'home' %}"
    class="logout-btn" onclick="handleLogout()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
      </svg>
      Logout
    </a>
  </div>
</header>

<!-- ── MAIN ───────────────────────────────────────────────────────────── -->
<main id="app" style="max-width:680px;margin:0 auto;padding:28px 18px 60px;"></main>

<script>
// ═══════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════
let S = {
  step: 0,          // 0 landing → 1 topic → 2 config → 3 voicecheck → 4 interview → 5 report
  topic: '',
  numQ: 5,
  level: 'medium',
  questions: [],
  curQ: 0,
  answers: [],
  vcTranscript: '',
  vcFeedback: '',
  recording: false,
  loading: false,
  report: null,
};

let recog = null;
let liveText = '';

// ═══════════════════════════════════════════════════════════════════════
// SPEECH
// ═══════════════════════════════════════════════════════════════════════
function mkRecog(onFinal, onEnd) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.continuous = true;
  r.interimResults = true;
  r.lang = 'en-US';
  r.onresult = e => {
    let fin = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) fin += e.results[i][0].transcript + ' ';
    }
    if (fin) onFinal(fin);
  };
  r.onerror = () => { S.recording = false; render(); };
  r.onend = () => { onEnd && onEnd(); };
  return r;
}

// ═══════════════════════════════════════════════════════════════════════
// CLAUDE API
// ═══════════════════════════════════════════════════════════════════════
async function ai(userMsg, sys) {
  const body = { model: 'claude-sonnet-4-20250514', max_tokens: 1000, messages: [{ role: 'user', content: userMsg }] };
  if (sys) body.system = sys;
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  const d = await res.json();
  return d.content?.[0]?.text || '';
}

// ═══════════════════════════════════════════════════════════════════════
// RENDER ENGINE
// ═══════════════════════════════════════════════════════════════════════
function render() {
  document.getElementById('app').innerHTML = [
    screenLanding, screenTopic, screenConfig, screenVoice, screenInterview, screenReport
  ][S.step]();
  applyBars();
}

function applyBars() {
  // animate score bars after report renders
  setTimeout(() => {
    document.querySelectorAll('[data-width]').forEach(el => {
      el.style.width = el.getAttribute('data-width') + '%';
    });
  }, 80);
}

// ─── STEP 0: Landing ─────────────────────────────────────────────────
function screenLanding() {
  return `
  <div class="animate-in" style="text-align:center;padding:20px 0 8px;">
    <div class="chip chip-teal" style="margin-bottom:20px;display:inline-flex;">
      <span style="width:6px;height:6px;background:#00D4A8;border-radius:50%;margin-right:7px;"></span>
      Powered by Claude AI
    </div>
    <h1 style="font-size:clamp(32px,6vw,52px);font-weight:700;line-height:1.15;margin-bottom:16px;">
      Master Your<br>
      <span style="background:linear-gradient(135deg,#00D4A8,#3B82F6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Interview Game</span>
    </h1>
    <p style="color:var(--gb-muted);font-size:16px;max-width:420px;margin:0 auto 40px;line-height:1.65;">
      AI-powered mock interviews with real-time voice analysis, personalized feedback, and detailed performance reports.
    </p>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:36px;text-align:left;">
      ${[
        ['#00D4A8','M','Voice Analysis','Confidence & clarity scoring from your real speech'],
        ['#3B82F6','B','Smart Questions','Role-specific questions at your chosen difficulty'],
        ['#A855F7','P','Full Report','Detailed breakdown with actionable tips']
      ].map(([c, cls, title, desc]) => `
        <div class="card" style="padding:18px 16px;">
          <div class="feature-icon" style="background:${c}1a;margin-bottom:12px;">
            ${cls === 'M' ? micIcon(c, 20) : cls === 'B' ? brainIcon(c, 20) : chartIcon(c, 20)}
          </div>
          <div style="font-family:'Sora',sans-serif;font-weight:600;font-size:13px;margin-bottom:5px;">${title}</div>
          <div style="color:var(--gb-muted);font-size:12px;line-height:1.5;">${desc}</div>
        </div>`).join('')}
    </div>

    <button class="btn-primary" style="padding:15px 40px;font-size:15px;" onclick="go(1)">
      ${arrowIcon()} Start Practice Interview
    </button>
    <p style="color:var(--gb-muted);font-size:12px;margin-top:14px;">Free · No sign-up required</p>
  </div>`;
}

// ─── STEP 1: Topic ───────────────────────────────────────────────────
function screenTopic() {
  return `
  <div class="animate-in">
    ${stepBar(1)}
    <h2 style="font-size:24px;font-weight:600;margin-bottom:6px;">What's your interview for?</h2>
    <p style="color:var(--gb-muted);margin-bottom:24px;font-size:15px;">Enter the job role or subject you want to practice.</p>

    <div class="card" style="padding:22px;margin-bottom:14px;">
      <label style="display:block;font-size:13px;color:var(--gb-muted);margin-bottom:10px;font-weight:500;">Job Role / Topic</label>
      <input id="topicIn" class="input-field" style="padding:13px 16px;" placeholder="e.g. Frontend Developer, Data Science, Marketing Manager..." value="${escHtml(S.topic)}"/>
      <div style="margin-top:18px;">
        <p style="font-size:12px;color:var(--gb-muted);margin-bottom:10px;">Quick picks:</p>
        <div class="tag-grid">
          ${['Frontend Dev','Backend Dev','Full Stack','Data Science','Product Manager','UX Designer','DevOps','Machine Learning','Marketing','Finance'].map(t =>
            `<span class="tag-pill" onclick="pickTopic('${t}')">${t}</span>`
          ).join('')}
        </div>
      </div>
    </div>

    <div style="display:flex;gap:10px;" class="btn-row">
      <button class="btn-ghost" style="padding:13px 22px;" onclick="go(0)">← Back</button>
      <button class="btn-primary" style="padding:13px 24px;flex:1;" onclick="saveTopic()">Continue →</button>
    </div>
  </div>`;
}

// ─── STEP 2: Config ──────────────────────────────────────────────────
function screenConfig() {
  const levels = [
    { id:'easy', icon:'🌱', label:'Beginner', desc:'Core concepts & basics' },
    { id:'medium', icon:'🔥', label:'Intermediate', desc:'Applied skills & scenarios' },
    { id:'hard', icon:'⚡', label:'Expert', desc:'Advanced deep dives' }
  ];
  return `
  <div class="animate-in">
    ${stepBar(2)}
    <h2 style="font-size:24px;font-weight:600;margin-bottom:6px;">Set up your interview</h2>
    <p style="color:var(--gb-muted);margin-bottom:24px;font-size:15px;">Customise the format for your <span style="color:var(--gb-text);font-weight:500;">${escHtml(S.topic)}</span> interview.</p>

    <div class="card" style="padding:22px;margin-bottom:12px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <label style="font-size:13px;color:var(--gb-muted);font-weight:500;">Number of Questions</label>
        <span id="nqv" style="font-family:'Sora',sans-serif;font-weight:700;font-size:24px;color:var(--gb-accent);">${S.numQ}</span>
      </div>
      <input type="range" min="3" max="10" value="${S.numQ}" step="1"
        style="width:100%;accent-color:#00D4A8;"
        oninput="S.numQ=parseInt(this.value);document.getElementById('nqv').textContent=S.numQ;">
      <div style="display:flex;justify-content:space-between;margin-top:6px;">
        <span style="font-size:11px;color:var(--gb-muted);">3 (Quick)</span>
        <span style="font-size:11px;color:var(--gb-muted);">10 (Full)</span>
      </div>
    </div>

    <div class="card" style="padding:22px;margin-bottom:16px;">
      <label style="display:block;font-size:13px;color:var(--gb-muted);font-weight:500;margin-bottom:14px;">Difficulty Level</label>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">
        ${levels.map(l => `
          <div class="level-opt ${S.level===l.id?'active':''}" style="padding:16px 10px;text-align:center;" onclick="setLevel('${l.id}')">
            <div style="font-size:22px;margin-bottom:8px;">${l.icon}</div>
            <div class="level-label" style="font-family:'Sora',sans-serif;font-weight:600;font-size:13px;">${l.label}</div>
            <div style="color:var(--gb-muted);font-size:11px;margin-top:4px;">${l.desc}</div>
          </div>`).join('')}
      </div>
    </div>

    <div style="display:flex;gap:10px;" class="btn-row">
      <button class="btn-ghost" style="padding:13px 22px;" onclick="go(1)">← Back</button>
      <button class="btn-primary" style="padding:13px 24px;flex:1;" onclick="go(3)">Continue →</button>
    </div>
  </div>`;
}

// ─── STEP 3: Voice Check ─────────────────────────────────────────────
function screenVoice() {
  const hasTx = !!S.vcTranscript.trim();
  const hasFb = !!S.vcFeedback;
  return `
  <div class="animate-in">
    ${stepBar(3)}
    <h2 style="font-size:24px;font-weight:600;margin-bottom:6px;">Voice Check</h2>
    <p style="color:var(--gb-muted);margin-bottom:24px;font-size:15px;">Let's warm up your voice before the real interview.</p>

    <div class="card" style="padding:20px;margin-bottom:12px;">
      <p style="font-size:12px;color:var(--gb-muted);margin-bottom:10px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;">Read this sentence aloud</p>
      <div style="background:var(--gb-surface);border:1px solid var(--gb-border2);border-radius:12px;padding:16px 18px;font-size:15px;line-height:1.7;color:var(--gb-text);border-left:3px solid var(--gb-accent);">
        "I'm excited to share my experience today. I have a strong background in ${escHtml(S.topic)} and I'm confident in my ability to bring real value to this role."
      </div>
    </div>

    <div class="card" style="padding:28px;text-align:center;margin-bottom:12px;">
      ${S.recording ? `
        <div style="display:flex;align-items:center;justify-content:center;gap:4px;height:40px;margin-bottom:18px;">
          <div class="wave-bar red"></div><div class="wave-bar red"></div><div class="wave-bar red"></div><div class="wave-bar red"></div><div class="wave-bar red"></div>
          <span style="margin-left:12px;font-size:13px;color:#EF4444;font-weight:500;">Listening...</span>
        </div>` :
        `<div style="height:40px;margin-bottom:18px;display:flex;align-items:center;justify-content:center;">
          <span style="font-size:13px;color:var(--gb-muted);">${hasTx ? '✓ Voice captured' : 'Press mic to start'}</span>
        </div>`}

      <div class="mic-wrap">
        <button class="mic-btn ${S.recording ? 'recording' : 'idle'}" onclick="toggleVC()">
          ${S.recording ? stopIcon() : micIcon('#060D17', 30)}
        </button>
      </div>
      <p style="font-size:13px;color:var(--gb-muted);margin-top:14px;">${S.recording ? 'Tap to stop recording' : 'Tap to record your voice'}</p>

      ${hasTx && !S.recording ? `
        <div style="margin-top:18px;background:var(--gb-surface);border:1px solid var(--gb-border);border-radius:12px;padding:14px;text-align:left;">
          <p style="font-size:11px;color:var(--gb-muted);margin-bottom:6px;font-weight:500;">TRANSCRIPT</p>
          <p style="font-size:14px;color:var(--gb-text);line-height:1.6;">${escHtml(S.vcTranscript)}</p>
        </div>` : ''}
    </div>

    ${S.loading ? `
      <div class="card" style="padding:28px;text-align:center;margin-bottom:12px;">
        <div class="loader" style="margin:0 auto 14px;"></div>
        <p style="color:var(--gb-muted);font-size:14px;">Analysing your voice confidence...</p>
      </div>` : ''}

    ${hasFb && !S.loading ? `
      <div class="card" style="padding:22px;margin-bottom:16px;border-color:rgba(0,212,168,0.3);">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
          <div style="width:8px;height:8px;background:var(--gb-accent);border-radius:50%;"></div>
          <span style="font-size:12px;font-weight:600;color:var(--gb-accent);text-transform:uppercase;letter-spacing:.5px;">AI Voice Feedback</span>
        </div>
        <p style="font-size:14px;line-height:1.7;color:var(--gb-text);">${escHtml(S.vcFeedback)}</p>
      </div>
      <div style="display:flex;gap:10px;" class="btn-row">
        <button class="btn-ghost" style="padding:13px 22px;" onclick="go(2)">← Back</button>
        <button class="btn-primary" style="padding:13px 24px;flex:1;" onclick="beginInterview()">Start Interview →</button>
      </div>` :
      `<div style="display:flex;gap:10px;" class="btn-row">
        <button class="btn-ghost" style="padding:13px 22px;" onclick="go(2)">← Back</button>
        ${hasTx && !S.loading && !S.recording ? `<button class="btn-primary" style="padding:13px 24px;flex:1;" onclick="analyseVC()">Analyse Voice →</button>` : ''}
      </div>`}
  </div>`;
}

// ─── STEP 4: Interview ───────────────────────────────────────────────
function screenInterview() {
  if (S.loading || !S.questions.length) {
    return `
    <div class="animate-in" style="text-align:center;padding:60px 0;">
      <div class="loader" style="margin:0 auto 20px;width:44px;height:44px;border-width:4px;"></div>
      <h3 style="font-size:20px;font-weight:600;margin-bottom:8px;">Generating Questions</h3>
      <p style="color:var(--gb-muted);font-size:14px;">Creating ${S.numQ} ${S.level} questions for ${escHtml(S.topic)}...</p>
    </div>`;
  }

  const q = S.questions[S.curQ];
  const pct = (S.curQ / S.questions.length) * 100;
  const hasAns = !!liveText.trim();

  return `
  <div class="animate-in">
    <div style="margin-bottom:20px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <span style="font-size:13px;color:var(--gb-muted);">Question ${S.curQ + 1} / ${S.questions.length}</span>
        <div style="display:flex;gap:6px;align-items:center;">
          <span class="chip chip-${S.level==='easy'?'teal':S.level==='medium'?'amber':'red'}">${S.level}</span>
          <span class="chip chip-blue">${escHtml(S.topic)}</span>
        </div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width:${pct}%;"></div>
      </div>
    </div>

    <div class="card" style="padding:24px;margin-bottom:14px;">
      <p style="font-size:11px;font-weight:600;color:var(--gb-muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:12px;">Question ${S.curQ + 1}</p>
      <p style="font-size:17px;line-height:1.65;font-weight:500;">${escHtml(q)}</p>
    </div>

    <div class="card" style="padding:26px;text-align:center;margin-bottom:14px;">
      ${S.recording ? `
        <div style="display:flex;align-items:center;justify-content:center;gap:4px;height:38px;margin-bottom:18px;">
          <div class="wave-bar red"></div><div class="wave-bar red"></div><div class="wave-bar red"></div><div class="wave-bar red"></div><div class="wave-bar red"></div>
          <span style="margin-left:10px;font-size:13px;color:#EF4444;font-weight:500;">Recording your answer...</span>
        </div>` :
        `<div style="height:38px;margin-bottom:18px;display:flex;align-items:center;justify-content:center;">
          <span style="font-size:13px;color:var(--gb-muted);">${hasAns ? '✓ Answer recorded' : 'Tap the mic to answer'}</span>
        </div>`}

      <div class="mic-wrap">
        <button class="mic-btn ${S.recording ? 'recording' : 'idle'}" onclick="toggleAns()">
          ${S.recording ? stopIcon() : micIcon('#060D17', 30)}
        </button>
      </div>
      <p style="font-size:13px;color:var(--gb-muted);margin-top:14px;">${S.recording ? 'Tap to stop' : 'Speak your answer'}</p>

      ${hasAns ? `
        <div style="margin-top:18px;background:var(--gb-surface);border:1px solid var(--gb-border);border-radius:12px;padding:14px;text-align:left;">
          <p style="font-size:11px;color:var(--gb-muted);margin-bottom:6px;font-weight:500;">YOUR ANSWER</p>
          <p id="liveTx" style="font-size:14px;color:var(--gb-text);line-height:1.65;">${escHtml(liveText)}</p>
        </div>` : `<div id="liveTx" style="display:none;"></div>`}
    </div>

    ${hasAns && !S.recording ? `
      <div style="display:flex;gap:10px;" class="btn-row">
        <button class="btn-ghost" style="padding:13px 22px;" onclick="clearAns()">Re-record</button>
        <button class="btn-primary" style="padding:13px 28px;flex:1;" onclick="nextQ()">
          ${S.curQ < S.questions.length - 1 ? 'Next Question →' : 'Finish Interview →'}
        </button>
      </div>` : ''}
  </div>`;
}

// ─── STEP 5: Report ──────────────────────────────────────────────────
function screenReport() {
  if (S.loading || !S.report) {
    return `
    <div class="animate-in" style="text-align:center;padding:60px 0;">
      <div class="loader" style="margin:0 auto 20px;width:44px;height:44px;border-width:4px;"></div>
      <h3 style="font-size:20px;font-weight:600;margin-bottom:8px;">Building Your Report</h3>
      <p style="color:var(--gb-muted);font-size:14px;">Analysing ${S.answers.length} answers and voice patterns...</p>
    </div>`;
  }

  const r = S.report;
  const score = r.overallScore || 0;
  const dash = 2 * Math.PI * 52;
  const offset = dash - (dash * score / 100);

  return `
  <div class="animate-in">
    <div style="text-align:center;margin-bottom:28px;">
      <div class="chip chip-teal" style="display:inline-flex;margin-bottom:16px;">Interview Complete</div>
      <h2 style="font-size:28px;font-weight:700;margin-bottom:6px;">Performance Report</h2>
      <p style="color:var(--gb-muted);font-size:14px;">${escHtml(S.topic)} · ${S.level} · ${S.numQ} questions</p>
    </div>

    <!-- Score ring -->
    <div class="card" style="padding:28px;text-align:center;margin-bottom:14px;">
      <svg width="130" height="130" viewBox="0 0 130 130">
        <circle cx="65" cy="65" r="52" fill="none" stroke="var(--gb-border)" stroke-width="9"/>
        <circle cx="65" cy="65" r="52" fill="none" stroke="url(#scoreGrad)" stroke-width="9"
          stroke-linecap="round" stroke-dasharray="${dash.toFixed(1)}"
          stroke-dashoffset="${offset.toFixed(1)}" transform="rotate(-90 65 65)" class="score-svg"/>
        <defs>
          <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00D4A8"/>
            <stop offset="100%" stop-color="#3B82F6"/>
          </linearGradient>
        </defs>
        <text x="65" y="61" text-anchor="middle" fill="var(--gb-text)" font-size="26" font-weight="700" font-family="Sora">${score}</text>
        <text x="65" y="79" text-anchor="middle" fill="var(--gb-muted)" font-size="11" font-family="DM Sans">out of 100</text>
      </svg>
      <h3 style="font-size:20px;font-weight:600;margin-bottom:6px;">${escHtml(r.verdict || 'Interview Complete')}</h3>
      <p style="color:var(--gb-muted);font-size:14px;max-width:420px;margin:0 auto;line-height:1.65;">${escHtml(r.summary || '')}</p>
    </div>

    <!-- Section scores -->
    ${r.sections && r.sections.length ? r.sections.map(sec => `
      <div class="card" style="padding:20px;margin-bottom:10px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${sec.score ? '10px' : '8px'};">
          <h4 style="font-size:14px;font-weight:600;">${escHtml(sec.title)}</h4>
          ${sec.score ? `<span style="font-size:13px;font-weight:600;color:var(--gb-accent);">${sec.score}%</span>` : ''}
        </div>
        ${sec.score ? `<div class="section-bar" style="margin-bottom:12px;"><div class="section-bar-fill" style="width:0%" data-width="${sec.score}"></div></div>` : ''}
        <p style="font-size:13px;color:var(--gb-muted);line-height:1.65;">${escHtml(sec.content || '')}</p>
      </div>`).join('') : ''}

    <!-- Q-by-Q feedback -->
    ${r.questionFeedback && r.questionFeedback.length ? `
      <div class="card" style="padding:22px;margin-bottom:14px;">
        <h3 style="font-size:16px;font-weight:600;margin-bottom:18px;">Question Breakdown</h3>
        ${r.questionFeedback.map((qf, i) => `
          <div style="margin-bottom:${i < r.questionFeedback.length - 1 ? '18px' : '0'};${i < r.questionFeedback.length - 1 ? 'padding-bottom:18px;border-bottom:1px solid var(--gb-border);' : ''}">
            <div style="display:flex;gap:10px;align-items:flex-start;">
              <div style="background:var(--gb-accent-dim);color:var(--gb-accent);border-radius:8px;padding:3px 9px;font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px;">Q${i + 1}</div>
              <div>
                <p style="font-size:13px;font-weight:500;margin-bottom:5px;">${escHtml(qf.question || '')}</p>
                <p style="font-size:13px;color:var(--gb-muted);line-height:1.6;">${escHtml(qf.feedback || '')}</p>
              </div>
            </div>
          </div>`).join('')}
      </div>` : ''}

    <div style="display:flex;gap:10px;margin-top:6px;" class="btn-row">
      <button class="btn-ghost" style="padding:13px 22px;flex:1;" onclick="resetApp()">Try Again</button>
      <button class="btn-primary" style="padding:13px 24px;flex:1;" onclick="saveReport()">Save to GoalBuddy →</button>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════════
// STEP BAR
// ═══════════════════════════════════════════════════════════════════════
function stepBar(cur) {
  const steps = ['Topic','Setup','Voice','Interview','Report'];
  return `
  <div style="display:flex;align-items:center;margin-bottom:28px;">
    ${steps.map((s, i) => {
      const n = i + 1;
      const cls = n < cur ? 'done' : n === cur ? 'active' : 'upcoming';
      return `
      <div style="display:flex;align-items:center;${i < steps.length - 1 ? 'flex:1;' : ''}">
        <div style="display:flex;align-items:center;gap:6px;">
          <div class="step-dot ${cls}">${cls === 'done' ? '✓' : n}</div>
          <span class="step-label" style="font-size:12px;color:${cls==='active'?'var(--gb-accent)':'var(--gb-muted)'};">${s}</span>
        </div>
        ${i < steps.length - 1 ? `<div style="flex:1;height:1px;background:${n < cur ? 'var(--gb-accent)' : 'var(--gb-border)'};margin:0 8px;"></div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════════════════════════
function go(s) { S.step = s; render(); }

function pickTopic(t) {
  S.topic = t;
  const el = document.getElementById('topicIn');
  if (el) el.value = t;
}

function saveTopic() {
  const val = (document.getElementById('topicIn')?.value || '').trim();
  if (!val) { toast('Please enter a topic first'); return; }
  S.topic = val;
  go(2);
}

function setLevel(l) { S.level = l; render(); }

// Voice check
function toggleVC() {
  if (S.recording) {
    recog?.stop(); S.recording = false; render();
  } else {
    S.vcTranscript = '';
    const r = mkRecog(txt => { S.vcTranscript += txt; render(); }, () => { S.recording = false; render(); });
    if (!r) { toast('Speech recognition not supported. Try Chrome.'); return; }
    recog = r; recog.start(); S.recording = true; render();
  }
}

async function analyseVC() {
  if (!S.vcTranscript.trim()) { toast('Please record your voice first'); return; }
  S.loading = true; render();
  const fb = await ai(
    `Analyse this voice check from a job interview candidate. Give honest, concise feedback (3–5 sentences) on:
    1. Confidence level
    2. Clarity and articulation  
    3. Pace and fluency
    4. Specific improvement tips
    
    Transcript: "${S.vcTranscript}"`,
    'You are a professional interview coach. Be encouraging but honest. Focus on voice confidence, delivery, and clarity. Keep feedback warm, specific, and actionable.'
  );
  S.vcFeedback = fb;
  S.loading = false;
  render();
}

// Interview
async function beginInterview() {
  S.step = 4; S.loading = true; S.curQ = 0; S.answers = []; liveText = '';
  render();
  const raw = await ai(
    `Generate exactly ${S.numQ} interview questions for a ${S.level} level ${S.topic} interview.
    Return ONLY a JSON array of strings. No markdown, no explanation.
    Example: ["Tell me about yourself.", "Describe a challenge you overcame."]`,
    'You are an expert interviewer. Return only a valid JSON array of question strings.'
  );
  try {
    S.questions = JSON.parse(raw.replace(/```json|```/g,'').trim());
  } catch {
    S.questions = genFallback(S.topic, S.numQ);
  }
  S.loading = false; render();
}

function genFallback(topic, n) {
  const qs = [
    `Tell me about your background and experience with ${topic}.`,
    `What are your strongest skills related to ${topic}?`,
    `Describe a challenging ${topic} project you worked on. What was your approach?`,
    `How do you keep your ${topic} knowledge current?`,
    `What's a significant achievement you're proud of in ${topic}?`,
    `How do you handle disagreements with teammates on ${topic} decisions?`,
    `Where do you see yourself growing in ${topic} over the next 2 years?`,
    `Describe a time you had to learn something new quickly in ${topic}.`,
    `What's your approach to problem-solving in ${topic}?`,
    `Why are you passionate about ${topic}?`
  ];
  return qs.slice(0, n);
}

function toggleAns() {
  if (S.recording) {
    recog?.stop(); S.recording = false; render();
  } else {
    const r = mkRecog(txt => {
      liveText += txt;
      const el = document.getElementById('liveTx');
      if (el) { el.textContent = liveText; el.style.display = 'block'; }
    }, () => { S.recording = false; render(); });
    if (!r) { toast('Speech recognition not supported. Try Chrome.'); return; }
    recog = r; recog.start(); S.recording = true; render();
  }
}

function clearAns() { liveText = ''; render(); }

function nextQ() {
  if (!liveText.trim()) { toast('Please record your answer first'); return; }
  S.answers.push({ question: S.questions[S.curQ], transcript: liveText });
  liveText = '';
  if (S.curQ < S.questions.length - 1) { S.curQ++; render(); }
  else buildReport();
}

async function buildReport() {
  S.step = 5; S.loading = true; render();
  const qa = S.answers.map((a, i) => `Q${i + 1}: ${a.question}\nAnswer: ${a.transcript}`).join('\n\n');
  const raw = await ai(
    `Analyse this mock interview and return a structured JSON report.

Topic: ${S.topic}
Level: ${S.level}
Voice check feedback: ${S.vcFeedback}

Q&A:
${qa}

Return ONLY valid JSON matching this exact structure:
{
  "overallScore": <integer 0–100>,
  "verdict": "<short verdict e.g. Strong Candidate / Good Progress / Needs Practice>",
  "summary": "<2-sentence overall assessment>",
  "sections": [
    {"title": "Technical Knowledge", "score": <0-100>, "content": "<2 sentences>"},
    {"title": "Communication & Clarity", "score": <0-100>, "content": "<2 sentences>"},
    {"title": "Voice Confidence", "score": <0-100>, "content": "<2 sentences>"},
    {"title": "Key Strengths", "content": "<2 sentences>"},
    {"title": "Areas to Improve", "content": "<2 actionable sentences>"}
  ],
  "questionFeedback": [
    {"question": "<question text>", "feedback": "<1-2 sentence feedback>"}
  ]
}`,
    'You are an expert interview coach. Analyse objectively and fairly. Return only valid JSON with no extra text.'
  );
  try {
    S.report = JSON.parse(raw.replace(/```json|```/g,'').trim());
  } catch {
    S.report = fallbackReport();
  }
  S.loading = false; render();
}

function fallbackReport() {
  return {
    overallScore: 72, verdict: 'Good Progress',
    summary: 'You demonstrated solid knowledge and enthusiasm for the topic. With more structured responses and concrete examples, you will perform even stronger.',
    sections: [
      { title:'Technical Knowledge', score:74, content:'You showed good foundational understanding. Try adding more specific technical examples to strengthen your answers.' },
      { title:'Communication & Clarity', score:70, content:'Your answers were generally understandable. Work on structuring responses with a clear opening, middle, and conclusion.' },
      { title:'Voice Confidence', score:68, content:'Your voice was mostly clear. Practice speaking a bit more slowly and with purpose to project greater confidence.' },
      { title:'Key Strengths', content:'Clear enthusiasm for the subject and genuine passion came through strongly. You also showed good awareness of the role.' },
      { title:'Areas to Improve', content:'Focus on using the STAR method (Situation, Task, Action, Result) for behavioural questions. Add specific numbers and outcomes to your examples.' }
    ],
    questionFeedback: S.answers.map((a, i) => ({
      question: a.question,
      feedback: 'Good attempt. Adding a specific example with a measurable outcome would make this answer much stronger.'
    }))
  };
}

function resetApp() {
  S = { step:0, topic:'', numQ:5, level:'medium', questions:[], curQ:0, answers:[], vcTranscript:'', vcFeedback:'', recording:false, loading:false, report:null };
  liveText = '';
  render();
}

function saveReport() { toast('Report saved to your GoalBuddy profile! 🎉'); }

function handleLogout() {
  if (confirm('Are you sure you want to log out?')) {
    toast('Logged out successfully.');
    setTimeout(resetApp, 1200);
  }
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// ═══════════════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════════════
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function micIcon(color, size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round">
    <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
    <path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/>
  </svg>`;
}
function stopIcon() {
  return `<svg width="28" height="28" viewBox="0 0 24 24" fill="#060D17"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>`;
}
function brainIcon(c, s) {
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><path d="M9.5 2C8 2 6.5 3.5 6.5 5.5c-1.5.3-3 1.7-3 3.5 0 1.4.8 2.6 2 3.2-.5.7-.5 1.8-.5 2.3 0 2.2 1.8 4 4 4h6c2.2 0 4-1.8 4-4 0-.5 0-1.6-.5-2.3 1.2-.6 2-1.8 2-3.2 0-1.8-1.5-3.2-3-3.5C17.5 3.5 16 2 14.5 2"/></svg>`;
}
function chartIcon(c, s) {
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>`;
}
function arrowIcon() {
  return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
}

// ─── INIT ────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
